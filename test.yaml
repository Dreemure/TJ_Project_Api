## 【使用前自查清单】
##   ☐ spring.cloud.function.definition    → 按当前服务实际使用的 Consumer Bean 名称裁剪
##   ☐ PowerJobProperties 字段名            → 确认 maxHeavyweightTaskNum / maxHeavyTaskNum 与 YAML 键名一致
##   ☐ springdoc.packages-to-scan          → 与 tj.swagger.packagePath 保持一致
##   ☐ Redisson 独有配置                    → 若需集群/哨兵模式，改用 spring.data.redis.cluster.* 或自定义 RedissonConfig
##   ☐ spring.cloud.stream.bindings.*      → 每个微服务只保留自己用到的绑定，其余整体删除
##   ☐ server.port / spring.application.name → 每个服务必须独立
##   ☐ spring.datasource.url               → 每个服务使用自己的数据库
##   ☐ tj.powerjob.worker.app-name         → 需在 PowerJob 控制台注册的应用名
