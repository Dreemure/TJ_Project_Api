# ========== 公共配置（所有环境共用） ==========
spring:
  application:
    name: my-service

server:
  port: 8080

# ========== 本地开发环境 (激活 local) ==========
---
spring:
  config:
    activate:
      on-profile: local
  # 数据源示例：直连本机 127.0.0.1
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mydb?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # Redis 示例：连本机
  data:
    redis:
      host: 127.0.0.1
      port: 6379

# ========== Docker/容器环境 (激活 docker) ==========
---
spring:
  config:
    activate:
      on-profile: docker
  # 数据源示例：连 docker-compose 中的 mysql 服务（服务名即网络域名）
  datasource:
    url: jdbc:mysql://mysql-service:3306/mydb?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # Redis 示例：连 docker-compose 中的 redis 服务
  data:
    redis:
      host: redis-service
      port: 6379