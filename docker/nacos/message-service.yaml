server:
  port: 10018

spring:
  grpc:
    # 本服务 gRPC 服务端端口（约定 = HTTP 端口 + 1000，可被 TJ_GRPC_<服务>_PORT 覆盖）
    server:
      port: ${TJ_GRPC_MESSAGE_PORT:11018}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${TJ_MYSQL_HOST:127.0.0.1}:${TJ_MYSQL_PORT:3306}/tj_message?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${TJ_MYSQL_USERNAME:root}
    password: ${TJ_MYSQL_PASSWORD:root}
  cloud:
    stream:
      bindings:
        sms-out-0: { destination: sms.direct, producer: { routing-key-expression: "'sms.message'" } }
        error-out-0: { destination: error.topic, producer: { routing-key-expression: "'error.#'" } }

tj:
  sms:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}

  swagger:
    package-path: com.tjxt.messageservice           # 本服务 Controller 所在包（文档按包分组扫描）
powerjob:
  worker:
    enabled: true
    app-name: message-service
    server-address: ${TJ_POWERJOB_HOST:127.0.0.1}:${TJ_POWERJOB_PORT:7700}
    allow-lazy-connect-server: true   # Server 未就绪也能启动（老项目 xxl-job 同样容忍）
