server:
  port: 10010 # 使用时直接请求网关即可，后缀路径以下方路由为例，比如: http://127.0.0.1:10010/media/api/....
  shutdown: graceful

spring:
  cloud:
    loadbalancer:
      nacos:
        enabled: true

    gateway:
      server:
        webflux:
          routes:
            - id: media                        # 路由的唯一标识，随便起，不重复即可
              uri: lb://media-service          # 目标地址。lb://服务名 表示通过负载均衡转发到注册中心里的对应服务
              predicates: [ Path=/media/** ]   # 匹配条件。Path=/xxx/** 表示路径以 /xxx/ 开头才匹配
            - id: auth
              uri: lb://auth-service
              predicates: [ Path=/auth/** ]
              filters: [ PreserveHostHeader ]
            - id: data
              uri: lb://data-service
              predicates: [ Path=/data/** ]
            - id: message
              uri: lb://message-service
              predicates: [ Path=/message/** ]
            - id: user
              uri: lb://user-service
              predicates: [ Path=/user/** ]
            - id: course
              uri: lb://course-service
              predicates: [ Path=/course/** ]
            - id: order
              uri: lb://trade-service
              predicates: [ Path=/order/** ]
            - id: search
              uri: lb://search-service
              predicates: [ Path=/search/** ]
            - id: learning
              uri: lb://learning-service
              predicates: [ Path=/learning/** ]
            - id: pay
              uri: lb://pay-service
              predicates: [ Path=/pay/** ]
            - id: trade
              uri: lb://trade-service
              predicates: [ Path=/trade/** ]
            - id: exam
              uri: lb://exam-service
              predicates: [ Path=/exam/** ]
            - id: remark
              uri: lb://remark-service
              predicates: [ Path=/remark/** ]
            - id: promotion
              uri: lb://promotion-service
              predicates: [ Path=/promotion/** ]

          default-filters:
            - StripPrefix=1

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: [ "*" ]
                allowed-methods: [ GET, POST, DELETE, PUT, OPTIONS ]
                allowed-headers: "*"
                allow-credentials: true
                max-age: 360000

knife4j:
  gateway:
    enabled: true                          # 开启网关聚合模式
    strategy: discover                     # 聚合策略：服务发现模式
    discover:
      enabled: true                        # 启用服务发现（从 Nacos 拉取服务）
      version: openapi3                    # 使用 OpenAPI 3 规范
      excluded-services:                   # 排除不需要聚合的服务
        - gateway-service                  # 网关自身无业务接口，排除

# ==================== 网关鉴权（响应式 Spring Security + JWT 验签） ====================
# 详细说明（认证/鉴权流程、白名单与路由前缀、权限表匹配规则、排查手册）见 docs/authentication.md
tj:
  auth:
    # 免认证白名单，支持 /path 与 METHOD:/path 两种写法（ant 风格）。
    # 注意：这里写“经过网关的原始请求路径”；本项目路由带前缀且 StripPrefix=1，
    #       所以 auth 服务的 /accounts/login 在网关侧是 /auth/accounts/login
    exclude-path:
      - /error/**
      # ---------------- auth 服务公开接口 ----------------
      - /auth/v2/jwks
      - /auth/v2/accounts/login
      - /auth/v2/accounts/admin/login
      - /auth/v2/accounts/refresh
      - /auth/v2/accounts/admin/refresh
      - /auth/v2/accounts/logout
      - /auth/v2/key
      # ---------------- 文档与健康检查 ----------------
      - /doc.html
      - /webjars/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-resources/**
      - /actuator/**
      - /favicon.ico
    jwt:
      # 校验 token 的 issuer，需与 auth-service.yaml 的 tj.auth.jwt.issuer 一致；留空表示不校验
      issuer: tj-auth
      # 可选：网关直接用本地公钥验签（不访问 auth 服务），例如 classpath:keys/public_key.pem
      # public-key-path: classpath:keys/public_key.pem
    jwks:
      # 公钥来源：默认通过服务发现拉取 auth-service 的 /jwks；也可直连指定 uri
      service-name: auth-service
      # uri: http://auth-service:10011/jwks
      # 公钥刷新间隔（支持 auth 服务密钥轮换）
      refresh-interval: 10m
      timeout: 5s