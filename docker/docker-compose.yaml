name: tj_Project

services:
  # ---------- MySQL 8.0（业务 + Nacos + Seata + Canal） ----------
  tj-mysql:
    image: mysql:8.0
    container_name: TJ-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - TJ-mysql-data:/var/lib/mysql
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/nacos-seata.sql:/docker-entrypoint-initdb.d/02-nacos-seata.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --binlog-format=ROW
      - --log-bin=mysql-bin
      - --server-id=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tj-spring

  # ---------- MySQL 8.0（PowerJob 专用） ----------
  powerjob-mysql:
    image: mysql:8.0
    container_name: powerjob-mysql
    environment:
      MYSQL_ROOT_PASSWORD: No1Bug2Please3!
      MYSQL_DATABASE: powerjob-daily
      MYSQL_USER: powerjob
      MYSQL_PASSWORD: No1Bug2Please3!
    ports:
      - "3307:3306"
    volumes:
      - powerjob-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pNo1Bug2Please3!"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tj-spring

  # ---------- Redis ----------
  tj-redis:
    image: redis:7-alpine
    container_name: TJ-redis
    ports:
      - "6379:6379"
    volumes:
      - TJ-redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - tj-spring

  # ========== ES 9 + IK ==========
  tj-elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    container_name: TJ-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - TJ-es-data:/usr/share/elasticsearch/data
    networks:
      - tj-spring
  # =====================================================

  # ---------- Nginx Proxy Manager ----------
  tj-nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: TJ-nginx-proxy-manager
    ports:
      - "8080:80"
      - "443:443"
      - "81:81"
    volumes:
      - TJ-npm-data:/data
      - TJ-npm-letsencrypt:/etc/letsencrypt
    networks:
      - tj-spring

  # ---------- Node 25（开发环境） ----------
  tj-node25:
    image: node:25-alpine
    container_name: TJ-node25
    command: sleep infinity
    networks:
      - tj-spring

  # ---------- RabbitMQ ----------
  tj-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: TJ-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - TJ-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - tj-spring

  # ---------- PowerJob（调度中心） ----------
  tj-powerjob:
    image: powerjob/powerjob-server:latest
    container_name: TJ-powerjob
    environment:
      JVMOPTIONS: "-Xmx512m"
    ports:
      - "7700:7700"
    depends_on:
      powerjob-mysql:
        condition: service_healthy
    networks:
      - tj-spring
    volumes:
      - TJ-powerjob-data:/root/powerjob/server/

  # ---------- Canal Server ----------
  tj-canal:
    image: canal/canal-server:latest
    container_name: TJ-canal
    environment:
      canal.manager.admin.user: ""
      canal.manager.admin.passwd: ""
      canal.manager.admin.passwd.encrypt: false
      canal.instance.master.address: tj-mysql:3306
      canal.instance.dbUsername: root
      canal.instance.dbPassword: root
      canal.instance.connectionCharset: UTF-8
      canal.instance.tsdb.enable: true
      canal.instance.gtidon: false
      canal.instance.filter.regex: tj_course\\..*
      canal.destinations: example
    ports:
      - "11111:11111"
    depends_on:
      tj-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/11111'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - tj-spring
    volumes:
      - TJ-canal-logs:/home/admin/canal-server/logs

  # ---------- Canal Adapter ----------
  tj-canal-adapter:
    image: docker.io/funnyzak/canal-adapter:1.1.7
    container_name: TJ-canal-adapter
    environment:
      canal.adapter.admin.manager: tj-canal:11111
      canal.adapter.elasticsearch.hosts: tj-elasticsearch:9200
      canal.adapter.elasticsearch.cluster.name: elasticsearch
      canal.adapter.elasticsearch.username: ""
      canal.adapter.elasticsearch.password: ""
    volumes:
      - ./canal-adapter/application.yaml:/opt/canal/canal-adapter/conf/application.yml:ro
      - ./canal-adapter/es7/:/opt/canal/canal-adapter/conf/es7/:ro
    depends_on:
      tj-canal:
        condition: service_healthy
    networks:
      - tj-spring
    restart: on-failure

  # ---------- Nacos 3.1.1 ----------
  tj-nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: TJ-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: tj-mysql
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_PARAM: "useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "fFmnDGQ5iePts0yJcBP6CgAK8DYoWm/tYw5rB6F3qOPYLlF7DXX8a+5IkfOGgV+L"
      NACOS_AUTH_IDENTITY_KEY: "nacos"
      NACOS_AUTH_IDENTITY_VALUE: "nacos"
      NACOS_CONSOLE_PORT: "8080"
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      - "8849:8080"
    depends_on:
      tj-mysql:
        condition: service_healthy
    networks:
      - tj-spring
    volumes:
      - TJ-nacos-data:/home/nacos/data
      - TJ-nacos-logs:/home/nacos/logs

  # ---------- Nacos 配置自动发布（一次性任务） ----------
  tj-nacos-init:
    image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
    container_name: TJ-nacos-init
    depends_on:
      tj-nacos:
        condition: service_started
    volumes:
      - ./nacos:/nacos:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "==========================================="
        echo "   开始发布 Nacos 共享配置"
        echo "==========================================="
        pwsh -File /nacos/import-nacos.ps1 \
          -Server http://tj-nacos:8848 \
          -Username nacos \
          -Password nacos \
          -Namespace public \
          -Group DEFAULT_GROUP
        echo ""
        echo "==========================================="
        echo "   配置发布完成"
        echo "==========================================="
    networks:
      - tj-spring
    restart: "no"

  # ---------- Seata-Server 2.5.0 ----------
  tj-seata-server:
    image: apache/seata-server:2.5.0
    container_name: TJ-seata-server
    ports:
      - "8091:8091"
      - "7091:7091"
    volumes:
      - ./seata/application.yml:/seata-server/conf/application.yml:ro
      - TJ-seata-data:/seata-server/data
    depends_on:
      tj-mysql:
        condition: service_healthy
      tj-nacos:
        condition: service_started
    networks:
      - tj-spring

  # ---------- Sentinel Dashboard ----------
  tj-sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: TJ-sentinel
    environment:
      SENTINEL_DASHBOARD_USERNAME: sentinel
      SENTINEL_DASHBOARD_PASSWORD: sentinel
    ports:
      - "8858:8858"
    networks:
      - tj-spring
    volumes:
      - TJ-sentinel-data:/var/log/sentinel-dashboard

  # ---------- SkyWalking OAP Server ----------
  tj-skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: TJ-skywalking-oap
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: tj-elasticsearch:9200
      SW_ES_USER: ""
      SW_ES_PASSWORD: ""
      SW_TELEMETRY: prometheus
    ports:
      - "11800:11800"
      - "12800:12800"
    depends_on:
      tj-elasticsearch:
        condition: service_started
    networks:
      - tj-spring
    volumes:
      - TJ-skywalking-oap-data:/skywalking/data
    restart: on-failure
    dns:
      - 127.0.0.11

  # ---------- SkyWalking UI ----------
  tj-skywalking-ui:
    image: apache/skywalking-ui:latest
    container_name: TJ-skywalking-ui
    environment:
      SW_OAP_ADDRESS: tj-skywalking-oap:12800
    ports:
      - "8088:8080"
    depends_on:
      - tj-skywalking-oap
    networks:
      - tj-spring

  # ---------- Graylog MongoDB ----------
  tj-graylog-mongodb:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/mongo:6.0
    container_name: TJ-graylog-mongodb
    restart: unless-stopped
    volumes:
      - TJ-graylog-mongo-data:/data/db
    networks:
      - tj-spring

  # ---------- Graylog OpenSearch ----------
  tj-graylog-opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: TJ-graylog-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    volumes:
      - TJ-graylog-os-data:/usr/share/opensearch/data
    networks:
      - tj-spring

  # ---------- Graylog Server ----------
  tj-graylog:
    image: graylog/graylog:5.2.0
    container_name: TJ-graylog
    environment:
      GRAYLOG_PASSWORD_SECRET: somepasswordpepper
      GRAYLOG_ROOT_PASSWORD_SHA2: 8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
      GRAYLOG_HTTP_EXTERNAL_URI: http://localhost:9000/
      GRAYLOG_ELASTICSEARCH_HOSTS: http://tj-graylog-opensearch:9200
      GRAYLOG_MONGODB_URI: mongodb://tj-graylog-mongodb:27017/graylog
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "12201:12201/udp"
      - "1514:1514/udp"
    depends_on:
      - tj-graylog-mongodb
      - tj-graylog-opensearch
    networks:
      - tj-spring
    volumes:
      - TJ-graylog-data:/usr/share/graylog/data
    restart: unless-stopped

# ---------- 持久化卷 ----------
volumes:
  TJ-mysql-data:
  powerjob-mysql-data:
  TJ-redis-data:
  TJ-es-data:
  TJ-npm-data:
  TJ-npm-letsencrypt:
  TJ-rabbitmq-data:
  TJ-powerjob-data:
  TJ-canal-logs:
  TJ-nacos-data:
  TJ-nacos-logs:
  TJ-seata-data:
  TJ-sentinel-data:
  TJ-skywalking-oap-data:
  TJ-graylog-mongo-data:
  TJ-graylog-os-data:
  TJ-graylog-data:

# ---------- 网络 ----------
networks:
  tj-spring:
    name: tj-spring